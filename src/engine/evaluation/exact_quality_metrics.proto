syntax = "proto2";

package mozc.engine.evaluation;

message ExactRatio {
  required sint64 numerator = 1;
  required uint64 denominator = 2;
}

message CharacterError {
  required uint64 edit_distance_sum = 1;
  required uint64 reference_unicode_scalar_count = 2;
}

message ExactPairedBootstrap {
  required uint32 definition_version = 1;
  required uint64 sample_size = 2;
  required uint64 win_count = 3;
  required uint64 regression_count = 4;
  required uint64 tie_count = 5;
  required sint64 lower_gain_cases = 6;
  required sint64 upper_gain_cases = 7;
  required uint64 gain_denominator_cases = 8;
}
