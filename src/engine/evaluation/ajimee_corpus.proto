syntax = "proto2";

package mozc.engine.evaluation;

import "engine/evaluation/evaluation_artifact.proto";

message AjimeeInputCase {
  enum ContextSlice {
    CONTEXT_SLICE_UNSPECIFIED = 0;
    CONTEXT_SLICE_HAS_CONTEXT = 1;
    CONTEXT_SLICE_NO_CONTEXT = 2;
  }

  required uint64 source_index = 1;
  required string complete_katakana_reading = 2;
  required string published_preceding_context = 3;
  required ContextSlice context_slice = 4;
  required bool has_source_split_data = 5;
}

message AjimeeInputCorpus {
  required uint32 schema_version = 1;
  required EvaluationSourceIdentity source = 2;
  repeated AjimeeInputCase cases = 3;
}

message AjimeeAnswerCase {
  required uint64 source_index = 1;
  repeated string accepted_whole_outputs = 2;
}

message AjimeeAnswerCorpus {
  required uint32 schema_version = 1;
  required EvaluationSourceIdentity source = 2;
  repeated AjimeeAnswerCase cases = 3;
}
