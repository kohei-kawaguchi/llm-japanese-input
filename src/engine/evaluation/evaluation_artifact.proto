syntax = "proto2";

package mozc.engine.evaluation;

message EvaluationSourceIdentity {
  required string benchmark_name = 1;
  required string source_revision = 2;
  required string source_relative_path = 3;
  required string source_sha256 = 4;
  required string creator = 5;
  required string source_url = 6;
  required string license_identifier = 7;
  required string license_url = 8;
  required string upstream_dataset_url = 9;
  required string changes_notice = 10;
}

message EvaluationMozcIdentity {
  required string source_revision = 1;
  required string data_type = 2;
  required string data_sha256 = 3;
  required string default_desktop_request_sha256 = 4;
  required string default_desktop_config_sha256 = 5;
  required string evaluation_clock_utc_rfc3339 = 6;
}
