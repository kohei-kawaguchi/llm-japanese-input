syntax = "proto2";

package mozc.engine.evaluation;

message FrozenCandidateRankerToken {
  required uint64 session_generation = 1;
  required uint64 state_revision = 2;
  required uint64 request_sequence = 3;
}

message FrozenCandidateRankerCandidate {
  required uint64 id = 1;
  required string key = 2;
  required string value = 3;
  required int32 cost = 4;
  required uint32 attributes = 5;
  required uint32 consumed_key_size = 6;
  required bool is_protected = 7;
}

message FrozenCandidateRankerSegment {
  required uint64 id = 1;
  required string key = 2;
  repeated FrozenCandidateRankerCandidate candidates = 3;
}

message FrozenCandidateRankerRequest {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_SUGGESTION = 1;
    MODE_PREDICTION = 2;
    MODE_CONVERSION = 3;
  }

  required FrozenCandidateRankerToken token = 1;
  required Mode mode = 2;
  required string preceding_text = 3;
  required string following_text = 4;
  required string reading = 5;
  required uint64 focused_segment_id = 6;
  repeated FrozenCandidateRankerSegment segments = 7;
}
