syntax = "proto2";

package mozc.engine.evaluation;

import "engine/evaluation/evaluation_artifact.proto";

enum QualityRegressionCorpusRole {
  QUALITY_REGRESSION_CORPUS_ROLE_UNSPECIFIED = 0;
  DEVELOPMENT = 1;
  HOLDOUT = 2;
}

message QualityRegressionCorpusIdentity {
  required QualityRegressionCorpusRole role = 1;
  required EvaluationSourceIdentity source = 2;
  required uint32 parser_definition_version = 3;
  required uint32 normalization_definition_version = 4;
  required string import_config_sha256 = 5;
}

message QualityRegressionInputCase {
  required uint64 source_line = 1;
  required string reading = 2;
}

message QualityRegressionInputCorpus {
  required uint32 schema_version = 1;
  required QualityRegressionCorpusIdentity identity = 2;
  repeated QualityRegressionInputCase cases = 3;
}

message QualityRegressionAnswerCase {
  required uint64 source_line = 1;
  required string normalized_whole_output = 2;
}

message QualityRegressionAnswerCorpus {
  required uint32 schema_version = 1;
  required QualityRegressionCorpusIdentity identity = 2;
  repeated QualityRegressionAnswerCase cases = 3;
}

message QualityRegressionImportPartition {
  required QualityRegressionCorpusRole role = 1;
  required EvaluationSourceIdentity source = 2;
  required uint32 expected_parsed_row_count = 3;
  required uint32 expected_conversion_expected_row_count = 4;
  required uint32 expected_rank_zero_row_count = 5;
  required uint32 expected_duplicate_pair_count = 6;
  required uint32 expected_final_case_count = 7;
}

message QualityRegressionImporterConfig {
  required uint32 schema_version = 1;
  required uint32 input_corpus_schema_version = 2;
  required uint32 answer_corpus_schema_version = 3;
  required uint32 parser_definition_version = 4;
  required uint32 normalization_definition_version = 5;
  repeated QualityRegressionImportPartition partitions = 6;
}
