syntax = "proto2";

package mozc.engine.evaluation;

import "engine/evaluation/ajimee_capacity_audit.proto";

enum AjimeeSemanticOutcome {
  AJIMEE_SEMANTIC_OUTCOME_UNSPECIFIED = 0;
  AJIMEE_SEMANTIC_SUCCESS = 1;
  AJIMEE_SEMANTIC_BACKEND_ERROR = 2;
  AJIMEE_SEMANTIC_INVALID_RESPONSE = 3;
}

enum AjimeeSemanticNumericProfile {
  AJIMEE_SEMANTIC_NUMERIC_PROFILE_UNSPECIFIED = 0;
  AJIMEE_SEMANTIC_CONFIGURED = 1;
}

message AjimeeSemanticRunnerConfig {
  required uint32 schema_version = 1;
  required uint32 semantic_results_schema_version = 2;
  required string capacity_audit_config_sha256 = 3;
  required string capacity_audit_sha256 = 4;
  required AjimeeSemanticNumericProfile numeric_profile = 5;
}

message AjimeeSemanticResultsIdentity {
  required string frozen_corpus_sha256 = 1;
  required string capacity_audit_config_sha256 = 2;
  required string capacity_audit_sha256 = 3;
  required AjimeeCapacityAuditIdentity capacity_audit_identity = 4;
  required AjimeeSemanticNumericProfile numeric_profile = 5;
}

message AjimeeSemanticSegmentOrder {
  required uint64 segment_id = 1;
  repeated uint64 candidate_ids = 2;
}

message AjimeeSemanticCaseResult {
  required uint64 source_index = 1;
  required AjimeeSemanticOutcome outcome = 2;
  required AjimeeCanonicalStatusCode canonical_status_code = 3;
  optional bool response_token_matches_request = 4;
  repeated AjimeeSemanticSegmentOrder response_segment_orders = 5;
  optional string merged_top_output = 6;
  optional bool response_within_request_bounds = 7;
  optional uint64 response_segment_order_count = 8;
  optional uint64 response_candidate_id_count = 9;
}

message AjimeeSemanticResults {
  required uint32 schema_version = 1;
  required AjimeeSemanticResultsIdentity identity = 2;
  repeated AjimeeSemanticCaseResult cases = 3;
}
