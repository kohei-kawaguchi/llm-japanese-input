syntax = "proto2";

package mozc.engine.evaluation;

import "engine/evaluation/evaluation_artifact.proto";
import "engine/evaluation/frozen_candidate_ranker.proto";

message AjimeeFreezerConfig {
  required uint32 schema_version = 1;
  required uint32 input_corpus_schema_version = 2;
  required uint32 frozen_corpus_schema_version = 3;
  required EvaluationSourceIdentity expected_source = 4;
  required string input_corpus_sha256 = 5;
  required uint32 expected_case_count = 6;
  required string mozc_source_revision = 7;
  required string mozc_data_type = 8;
  required string mozc_data_sha256 = 9;
  required string default_desktop_request_sha256 = 10;
  required string default_desktop_config_sha256 = 11;
  required string evaluation_clock_utc_rfc3339 = 12;
}

message AjimeeFrozenCase {
  required uint64 source_index = 1;
  required string normalized_hiragana_reading = 2;
  required bool history_reconstructed = 3;
  required string baseline_output = 4;
  required FrozenCandidateRankerRequest request = 5;
}

message AjimeeFrozenCorpus {
  required uint32 schema_version = 1;
  required EvaluationSourceIdentity source = 2;
  required string input_corpus_sha256 = 3;
  required EvaluationMozcIdentity mozc = 4;
  repeated AjimeeFrozenCase cases = 5;
}
