syntax = "proto2";

package mozc.engine.evaluation;

import "engine/evaluation/evaluation_artifact.proto";
import "engine/evaluation/frozen_candidate_ranker.proto";
import "engine/evaluation/quality_regression_corpus.proto";

message QualityRegressionFreezerConfig {
  required uint32 schema_version = 1;
  required uint32 input_corpus_schema_version = 2;
  required uint32 frozen_corpus_schema_version = 3;
  required QualityRegressionCorpusIdentity expected_corpus_identity = 4;
  required string input_corpus_sha256 = 5;
  required uint32 expected_case_count = 6;
  required EvaluationMozcIdentity mozc = 7;
}

message QualityRegressionFrozenCase {
  required uint64 source_line = 1;
  required string conversion_reading = 2;
  required string mozc_baseline_output = 3;
  required FrozenCandidateRankerRequest request = 4;
}

message QualityRegressionFrozenCorpus {
  required uint32 schema_version = 1;
  required QualityRegressionCorpusIdentity identity = 2;
  required string input_corpus_sha256 = 3;
  required EvaluationMozcIdentity mozc = 4;
  repeated QualityRegressionFrozenCase cases = 5;
  required string freezer_config_sha256 = 6;
}
