syntax = "proto2";

package mozc.engine.evaluation;

import "engine/evaluation/exact_quality_metrics.proto";
import "engine/evaluation/quality_regression_corpus.proto";

message QualityRegressionDevelopmentBaselineReportConfig {
  required uint32 schema_version = 1;
  required uint32 frozen_corpus_schema_version = 2;
  required uint32 answer_corpus_schema_version = 3;
  required uint32 report_schema_version = 4;
  required QualityRegressionCorpusIdentity expected_corpus_identity = 5;
  required string frozen_corpus_sha256 = 6;
  required string answer_corpus_sha256 = 7;
  required uint32 expected_case_count = 8;
  required uint32 expected_correct_count = 9;
}

message QualityRegressionDevelopmentBaselineReportIdentity {
  required string report_config_sha256 = 1;
  required string frozen_corpus_sha256 = 2;
  required string answer_corpus_sha256 = 3;
  required QualityRegressionCorpusIdentity corpus_identity = 4;
}

message QualityRegressionDevelopmentBaselineReport {
  required uint32 schema_version = 1;
  required QualityRegressionDevelopmentBaselineReportIdentity identity = 2;
  required uint64 case_count = 3;
  required uint64 correct_count = 4;
  required ExactRatio top_output_accuracy = 5;
}
